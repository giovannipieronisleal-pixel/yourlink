services:
  - type: web
    name: youlink-loja
    runtime: docker
    dockerfilePath: ./src/ClothingStore.Web/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: YOULINK_PORTAL_HOME
        value: "true"
      - key: YOULINK_SYNC_SECRET
        generateValue: true
      # Alternativa gratuita de persistência permanente (escolha UMA opção no painel Render -> Environment):
      # Opção A (Recomendada): PostgreSQL gratuito em neon.tech -> DATABASE_URL=postgresql://...
      - key: YOULINK_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      # Opção B: Supabase Storage/REST gratuito -> SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Opcional (recomendado): chave fixa base64/texto para criptografia OAuth entre redeploys
      - key: YOULINK_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MP_CLIENT_ID
        sync: false
      - key: MP_CLIENT_SECRET
        sync: false
      - key: MP_PLATFORM_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: YOULINK_SUPPORT_WHATSAPP
        sync: false
      # Opcional: Proteção anti-bot Cloudflare Turnstile (login/cadastro/checkout Pix)
      - key: CLOUDFLARE_TURNSTILE_SITE_KEY
        sync: false
      - key: CLOUDFLARE_TURNSTILE_SECRET_KEY
        sync: false
      - key: CLOUDFLARE_TURNSTILE_HOSTNAMES
        value: "youlink-loja.onrender.com,youlink-edge-accelerator.youlink-edge.workers.dev"
      # Opcional: IA Google Gemini (modelo gemini-4-hydrogen) para Estúdio IA de Produtos
      - key: GEMINI_API_KEY
        sync: false
      # Opcional: URL do Worker Cloudflare Edge e Banner Remoto
      - key: YOULINK_EDGE_PROXY_URL
        value: "https://youlink-edge-accelerator.youlink-edge.workers.dev"
      - key: YOULINK_GLOBAL_BANNER
        sync: false
      # OBRIGATÓRIO em produção: Envio automático de código OTP de 6 dígitos por E-mail
      # (necessário para cadastro de conta, confirmação de e-mail, troca de e-mail e recuperação de senha — configure Brevo, Resend OU SMTP):
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
