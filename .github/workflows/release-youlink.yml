name: Build e Release YouLink

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release no GitHub (ex.: v1.0.1)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Testes Automatizados (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Executar testes unitários
        run: dotnet run --project tests/ClothingStore.UnitTests/ClothingStore.UnitTests.csproj -c Release

  build-android:
    name: Compilar Android APK (YouLink)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "microsoft"
          java-version: "21"

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Instalar workload Android MAUI
        run: dotnet workload install maui-android

      - name: Garantir dependências do Android SDK (API 36)
        run: dotnet build appmaui.blazor.csproj -t:InstallAndroidDependencies -f net10.0-android -c Release -p:AcceptAndroidSDKLicenses=true

      - name: Publicar APK Release
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          CLEAN_B64=$(printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ')
          CLEAN_STORE_PASS=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n\t ')
          CLEAN_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n\t ')
          CLEAN_KEY_PASS=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n\t ')

          if [[ -z "$CLEAN_B64" || -z "$CLEAN_STORE_PASS" || -z "$CLEAN_ALIAS" || -z "$CLEAN_KEY_PASS" ]]; then
            echo "::error::Configure os 4 Secrets obrigatorios do GitHub Actions (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD) antes de publicar um release Android."
            exit 1
          fi

          if ! printf '%s' "$CLEAN_B64" | base64 -d > "$RUNNER_TEMP/youlink-release.keystore" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 nao contem um Base64 valido. Copie somente a linha Base64 abaixo do item 1) em App_Data/android-secrets.local.txt."
            exit 1
          fi

          KS_BYTES=$(wc -c < "$RUNNER_TEMP/youlink-release.keystore")
          echo "Keystore decodificada: ${KS_BYTES} bytes."
          if [[ "$KS_BYTES" -lt 500 ]]; then
            echo "::error::A keystore decodificada tem apenas ${KS_BYTES} bytes (incompleta). Atualize o Secret ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          cat > "$RUNNER_TEMP/VerifyKeystore.java" << 'JAVA'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;
          import java.util.Collections;

          public class VerifyKeystore {
              public static void main(String[] args) throws Exception {
                  String path = args[0], alias = args[1], storePass = args[2], keyPass = args[3];
                  KeyStore ks = KeyStore.getInstance("PKCS12");
                  try (FileInputStream fis = new FileInputStream(path)) {
                      ks.load(fis, storePass.toCharArray());
                  } catch (Exception ex) {
                      System.err.println("ERRO_KEYSTORE_OU_SENHA_STORE: " + ex.getClass().getSimpleName() + ": " + ex.getMessage());
                      System.exit(11);
                  }
                  if (!ks.containsAlias(alias)) {
                      System.err.println("ERRO_ALIAS_NAO_ENCONTRADO. Aliases na keystore: " + Collections.list(ks.aliases()));
                      System.exit(12);
                  }
                  try {
                      Key k = ks.getKey(alias, keyPass.toCharArray());
                      if (k == null) {
                          System.err.println("ERRO_CHAVE_NULA para alias: " + alias);
                          System.exit(13);
                      }
                      System.out.println("Keystore e chave privada validadas (" + k.getAlgorithm() + ").");
                  } catch (Exception ex) {
                      System.err.println("ERRO_SENHA_CHAVE_PRIVADA (ANDROID_KEY_PASSWORD): " + ex.getClass().getSimpleName() + ": " + ex.getMessage());
                      System.exit(14);
                  }
              }
          }
          JAVA
          java "$RUNNER_TEMP/VerifyKeystore.java" "$RUNNER_TEMP/youlink-release.keystore" "$CLEAN_ALIAS" "$CLEAN_STORE_PASS" "$CLEAN_KEY_PASS"
          rm -f "$RUNNER_TEMP/VerifyKeystore.java"

          echo "Assinando APK com keystore privada configurada nos Secrets do GitHub..."
          dotnet publish appmaui.blazor.csproj -f net10.0-android -c Release -p:AndroidPackageFormat=apk -m:1 \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/youlink-release.keystore" \
            -p:AndroidSigningKeyAlias="$CLEAN_ALIAS" \
            -p:AndroidSigningKeyPass="$CLEAN_KEY_PASS" \
            -p:AndroidSigningStorePass="$CLEAN_STORE_PASS"

      - name: Preparar arquivo YouLink-Android.apk
        run: |
          mkdir -p dist
          APK_FILE=$(ls bin/Release/net10.0-android/publish/*-Signed.apk 2>/dev/null | head -n 1 || true)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(ls bin/Release/net10.0-android/*.apk 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "Nenhum APK gerado."
            exit 1
          fi
          cp "$APK_FILE" dist/YouLink-Android.apk
          ls -lh dist/YouLink-Android.apk

      - name: Enviar artefato Android APK
        uses: actions/upload-artifact@v4
        with:
          name: YouLink-Android-APK
          path: dist/YouLink-Android.apk

  build-windows:
    name: Compilar Windows x64 (YouLink)
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Instalar workload Windows MAUI
        run: dotnet workload install maui-windows

      - name: Publicar executável Windows Release (x64 Self-Contained)
        run: dotnet publish appmaui.blazor.csproj -f net10.0-windows10.0.19041.0 -c Release -p:WindowsPackageType=None -o dist/YouLink-Windows -m:1

      - name: Executar testes automatizados no Windows e validar pacote x64
        env:
          YOULINK_WIN_PUBLISH_DIR: dist/YouLink-Windows
        run: dotnet run --project tests/ClothingStore.UnitTests/ClothingStore.UnitTests.csproj -c Release

      - name: Montar pacote organizado e Instalador Windows (YouLink.exe + Setup)
        shell: pwsh
        run: |
          [xml]$proj = Get-Content appmaui.blazor.csproj
          $appVer = ($proj.Project.PropertyGroup.ApplicationDisplayVersion | Where-Object { $_ } | Select-Object -First 1).Trim()
          & .\installer\build-windows-package.ps1 `
            -PublishDir dist/YouLink-Windows `
            -OutputZipPath dist-zip/YouLink-Windows-x64.zip `
            -OutputInstallerDir dist-installer `
            -Version $appVer `
            -RequireInstaller
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item dist-zip/YouLink-Windows-x64.zip dist-release/YouLink-Windows-x64.zip -Force
          Copy-Item dist-installer/YouLink-Setup-x64.exe dist-release/YouLink-Setup-x64.exe -Force

      - name: Enviar artefato Windows x64 (.zip portável + Setup .exe)
        uses: actions/upload-artifact@v4
        with:
          name: YouLink-Windows-x64
          path: dist-release/*

  release:
    name: Publicar GitHub Release e Limpar Antigos
    needs: [build-android, build-windows]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código para ler versão do app
        uses: actions/checkout@v4

      - name: Baixar instaladores compilados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Criar ou atualizar Release no GitHub e apagar releases antigos
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_FULL: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          TAG=""
          if [[ "$REF_FULL" == refs/tags/v* ]]; then
            TAG="$REF_NAME"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]] && [[ -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            APP_VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\([^<]*\)</ApplicationDisplayVersion>.*:\1:p' appmaui.blazor.csproj | head -n 1 | tr -d ' \t\r\n')
            if [[ -z "$APP_VERSION" ]]; then
              echo "Não foi possível ler <ApplicationDisplayVersion> em appmaui.blazor.csproj."
              exit 1
            fi
            TAG="v$APP_VERSION"
          fi

          echo "Release alvo: $TAG (commit $TARGET_SHA)"
          rm -rf flat-assets
          mkdir -p flat-assets
          find release-assets -type f -exec cp -f {} flat-assets/ \;
          (
            cd flat-assets
            for asset in YouLink-Setup-x64.exe YouLink-Windows-x64.zip YouLink-Android.apk; do
              if [[ -f "$asset" ]]; then
                sha256sum "$asset" | tee "${asset}.sha256" >> SHA256SUMS.txt
              fi
            done
          )
          ls -lh flat-assets/

          RELEASE_NOTES=$(printf '%s\n' \
            "## YouLink $TAG" \
            '' \
            'Aplicativo **YouLink** para **Android** e **Windows x64** com vitrine web integrada, gestão de estoque e publicação gratuita 24h direto pelo app.' \
            '' \
            '### Arquivos deste Release' \
            '- `YouLink-Setup-x64.exe` — **Instalador oficial Windows (Recomendado)**: instala em 1 clique com ícone do YouLink na Área de Trabalho e Menu Iniciar.' \
            '- `YouLink-Windows-x64.zip` — versão portável organizada na pasta `YouLink/` (`YouLink.exe` + subpasta `App/`); extraia tudo antes de abrir.' \
            '- `YouLink-Android.apk` — instalador Android (ative *"Instalar apps desconhecidos"* se instalar fora da Play Store).' \
            '' \
            '### Principais Recursos' \
            '- Publicação de site grátis 24h no Render em 3 passos sem terminal (**Loja & Visual**).' \
            '- Atualização automática com popup dentro do próprio app (Windows preservando `App_Data` e Android).' \
            '- Catálogo digital, QR Code, pedidos no WhatsApp, Pix EMV e cálculo de frete PAC/SEDEX.')

          if gh release view "$TAG" --repo "$REPO_NAME" >/dev/null 2>&1; then
            echo "Release $TAG já existe; atualizando instaladores e descrição..."
            gh release upload "$TAG" ./flat-assets/* --clobber --repo "$REPO_NAME"
            gh release edit "$TAG" --title "YouLink $TAG" --notes "$RELEASE_NOTES" --repo "$REPO_NAME"
          else
            gh release create "$TAG" ./flat-assets/* \
              --target "$TARGET_SHA" \
              --title "YouLink $TAG" \
              --notes "$RELEASE_NOTES" \
              --repo "$REPO_NAME"
          fi

          # Mantém as 3 releases mais recentes para permitir rollback seguro e apaga as mais antigas
          gh release view "$TAG" --repo "$REPO_NAME" >/dev/null

          ALL_TAGS=$(gh release list --limit 100 --repo "$REPO_NAME" --json tagName --jq '.[].tagName' || true)
          KEPT=0
          while IFS= read -r OLD_TAG; do
            OLD_TAG=$(echo "$OLD_TAG" | tr -d ' \t\r\n')
            if [[ -z "$OLD_TAG" ]]; then
              continue
            fi
            if [[ "$OLD_TAG" == "$TAG" ]]; then
              KEPT=$((KEPT + 1))
              continue
            fi
            if [[ "$KEPT" -lt 3 ]]; then
              echo "Preservando release recente para rollback: $OLD_TAG"
              KEPT=$((KEPT + 1))
              continue
            fi
            echo "Apagando release antigo: $OLD_TAG"
            gh release delete "$OLD_TAG" --yes --repo "$REPO_NAME"
          done <<< "$ALL_TAGS"
